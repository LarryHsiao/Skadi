  <text class="d-t mono" x="906" y="485" data-in="done@2.1">✅ Compliance Review — PASS</text>
  <text class="d-t mono" x="906" y="500" data-in="done@2.4">✅ Fresh verification — analyze ✓ · 42 passed</text>
  <text class="d-t mono" x="906" y="515" data-in="done@2.7">✅ Worklog — sent</text>
  <text class="d-t mono" x="906" y="530" data-in="done@3.0" data-en="⬜ Commit — not requested; awaiting your word">⬜ Commit — 未要求提交，等你一句話</text>
  <text class="d-na mono" x="906" y="545" data-in="done@3.4" data-en="n/a: DI — no new binding · /install — no config edit">n/a: DI — 無新 binding · /install — 未動 config</text>
  <text class="d-na mono" x="939" y="560" data-in="done@3.4" data-en="cache — no new file:line fact learned">cache — 沒學到新的 file:line 事實</text>
  <text class="c-pass mono" x="906" y="578" data-in="done@4.3">Compliance Review: PASS</text>

  <!-- captions -->
  <rect class="cap-bg" x="40" y="604" width="1200" height="100" rx="10"/>
  <g id="captions"></g>

</main>

<script>
(() => {
  'use strict';
  const P = new URLSearchParams(location.search);
  const CAPTURE = P.has('capture');
  const EMBED = P.has('embed');
  if (CAPTURE) document.documentElement.classList.add('capture');
  if (EMBED) document.documentElement.classList.add('embed');
  const LANG_KEY = 'skadi-handbook-lang'; // shared with the handbook chapters' own EN / 繁中 toggle
  const DOC_TITLE = { en: 'Reel · The small loop', zh: '動畫 · 小圈' };
  const PLAY_LABEL = { en: ['⏸ Pause', '▶ Play'], zh: ['⏸ 暫停', '▶ 播放'] };

  const NS = 'http://www.w3.org/2000/svg';
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const ramp = (t, a, d = 0.4) => clamp((t - a) / d);
  const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const FADE = 0.4;
  const SEEK_LEAD = 0.35; // seek lands just inside a scene so its caption is already up
  function el(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  // a { zh, en } pair carries one text per language
  const langAttrs = v => ({ 'data-zh': v.zh, 'data-en': v.en });
  function pickLang() {
    const asked = P.get('lang');
    if (asked === 'en' || asked === 'zh') return asked;
    try { return localStorage.getItem(LANG_KEY) === 'zh' ? 'zh' : 'en'; } catch (e) { return 'en'; }
  }

  // ---- the story -------------------------------------------------------
  const SCENES = [
    { id: 'intro', dur: 3.5, badge: '◆', label: { zh: '序', en: 'Intro' },
      title: { zh: '小圈：一個任務，從估量到「done」', en: 'The small loop: one task, from sizing to “done”' },
      lines: {
        zh: ['大圈裡自己動手的那一段（/working），或你在 session 裡直接交代的任何一件事，都照這一圈走。',
             '左邊四格在動手之前，中間是施工迴圈，右邊三格在說 done 之前。'],
        en: ['The hand-worked stretch of the big loop (/working), or anything you hand over in a session, runs this ring.',
             'Four stages before the first edit on the left, the building loop in the middle, three gates before “done” on the right.'] } },
    { id: 'size', dur: 4, badge: '1', label: { zh: '估量', en: 'Size' },
      title: { zh: '估量 · Task Sizing', en: 'Size · Task Sizing' },
      lines: {
        zh: ['動手之前先秤三件事：觸及多廣、想得多深、多容易撤回，量成 minimum、medium 或 heavy 三級。',
             'medium 以上，另附一份拆成 minimum 小步的建議。'],
        en: ['Before any edit, weigh three things — reach, depth, reversibility — and gauge the task minimum, medium or heavy.',
             'Medium or heavier also comes with a breakdown into minimum-sized steps.'] } },
    { id: 'accept', dur: 5, badge: '2', label: { zh: '驗收', en: 'Accept' },
      title: { zh: '驗收 · Acceptance＋Non-goals', en: 'Accept · Acceptance + Non-goals' },
      lines: {
        zh: ['寫下做完會看到什麼——寫結果，不寫動作：「空清單顯示 placeholder」，而非「顯示 placeholder」。',
             'Non-goals 寫明這次刻意不碰的地方；之後的審查與驗證，都以這幾行為準。'],
        en: ['Write what done will look like — outcomes, not actions: “the empty list renders the placeholder”, not “render the placeholder”.',
             'Non-goals name what this turn deliberately leaves alone; review and verification both measure against these lines.'] } },
    { id: 'approve', dur: 4.5, badge: '3', label: { zh: '核可', en: 'Approve' },
      title: { zh: '核可 · Change Approval', en: 'Approve · Change Approval' },
      lines: {
        zh: ['四欄 gate 貼出後，等你一句話，才動第一個檔。',
             '以 slash 呼叫的 skill，呼叫本身就是同意；唯讀的回合不需要這道 gate；或說一聲「just do it」，整個 session 都跳過。'],
        en: ['The four-field gate goes up, and nothing is edited until you give your word.',
             'A slash-invoked skill is its own approval; read-only turns are exempt; “just do it” stands the gate down for the session.'] } },
    { id: 'preview', dur: 4.5, badge: '4', label: { zh: '預覽', en: 'Preview' },
      title: { zh: '預覽 · Previews', en: 'Preview · Previews' },
      lines: {
        zh: ['動 UI 先畫線框，三種資料狀態：有資料、空狀態、溢出；UML 一圖一事；產生的計畫另鏡像成 plan-*.html。',
             '全部投進 Henneth 視窗：先看圖，再寫碼。'],
        en: ['A UI change gets a wireframe first, in three states: populated, empty, overflow; UML, one diagram per concern; a plan, a plan-*.html mirror.',
             'All of it lands in the Henneth window: see the picture, then write the code.'] } },
    { id: 'impl', dur: 15, badge: '5', label: { zh: '施工', en: 'Build' },
      title: { zh: '施工 · Implementation Loop', en: 'Build · Implementation Loop' },
      lines: {
        zh: ['每一步：先命名驗證，寫測試、看它因預期的原因失敗，實作一層，驗證，靜態分析乾淨，才打勾。',
             '切成層、不切成塊；驗證不過就回去改程式碼，不改驗證。這步若比預估重：停下，回 ① 重估，再等你一句話。'],
        en: ['Each step: name the check, watch a new test fail for the right reason, build one layer, verify, keep analysis clean — then tick.',
             'Layers, not slabs; a failed check means fix the code, not the check. A step heavier than gauged: stop, re-gauge, await your word.'] } },
    { id: 'review', dur: 6, badge: '6', label: { zh: '合規審查', en: 'Review' },
      title: { zh: '合規審查 · Compliance Review', en: 'Review · Compliance Review' },
      lines: {
        zh: ['另派一個唯讀 agent 讀整份 diff：先查規格（多做、少做都算），再查品質（style guide、專案慣例）。',
             '最後一行由審查者自己寫下：Compliance Review: PASS／FAIL。每個發現都要修掉，或明說為何保留。'],
        en: ['A separate read-only agent reads the whole diff: spec first (anything extra or missing), then quality (style guides, conventions).',
             'The reviewer writes the last line itself — Compliance Review: PASS or FAIL. Every finding is fixed or named as a knowing exception.'] } },
    { id: 'verify', dur: 4.5, badge: '7', label: { zh: '新鮮驗證', en: 'Verify' },
      title: { zh: '新鮮驗證 · Fresh Verification', en: 'Verify · Fresh Verification' },
      lines: {
        zh: ['修完之後在同一回合重跑：靜態分析＋全套測試。三則訊息前的綠燈不算數。',
             '再逐條走過驗收，每一條旁邊都要擺上這一回合的證據。'],
        en: ['After the fixes, run it again in the same turn: static analysis and the full test suite. A green run from three messages ago proves nothing.',
             'Then walk each acceptance line and set this turn’s evidence beside it.'] } },
    { id: 'done', dur: 6.5, badge: '8', label: { zh: 'Done', en: 'Done' },
      title: { zh: 'Done · 把完成說清楚', en: 'Done · spoken loud' },
      lines: {
        zh: ['Done 區塊一次列清：做完的 ✅、沒做的 ⬜、卡住的 🚫，計數要與列數相符；不適用的寫進 n/a。',
             '並送出一筆 worklog。最後一行固定是 Compliance Review 的判定：PASS、FAIL 或 SKIPPED——/este 的脈搏就讀這一行。'],
        en: ['The Done block lists it all — ✅ done, ⬜ not done, 🚫 blocked — counts matching the rows, the non-applicable on the n/a line.',
             'A worklog entry is sent. The last line is always the review’s verdict — PASS, FAIL or SKIPPED — the line /este reads.'] } },
  ];
  let acc = 0;
  for (const s of SCENES) { s.start = acc; acc += s.dur; }
  const TOTAL = acc;
  const S = Object.fromEntries(SCENES.map(s => [s.id, s]));
  // moments that several elements share; markup and code both name them '@name'
  const MOMENT = { approved: 'approve@2.3', failFrom: 'impl@6.05' };
  const T = ref => {
    const r = String(ref);
    if (r.startsWith('@')) return T(MOMENT[r.slice(1)]);
    const [id, off] = r.split('@');
    return S[id].start + (parseFloat(off) || 0);
  };

  const CHIPS = [
    { id: 'size', x: 40, w: 80, label: { zh: '① 估量', en: '① Size' } },
    { id: 'accept', x: 127, w: 80, label: { zh: '② 驗收', en: '② Accept' } },
    { id: 'approve', x: 213, w: 80, label: { zh: '③ 核可', en: '③ Approve' } },
    { id: 'preview', x: 300, w: 80, label: { zh: '④ 預覽', en: '④ Preview' } },
    { id: 'impl', x: 400, w: 460, label: { zh: '⑤ 施工 · Implementation Loop', en: '⑤ Build · Implementation Loop' } },
    { id: 'review', x: 880, w: 116, label: { zh: '⑥ 合規審查', en: '⑥ Review' } },
    { id: 'verify', x: 1002, w: 116, label: { zh: '⑦ 新鮮驗證', en: '⑦ Verify' } },
    { id: 'done', x: 1124, w: 116, label: { zh: '⑧ Done', en: '⑧ Done' } },
  ];
  const ZONES = { left: ['size', 'accept', 'approve', 'preview'], mid: ['impl'], right: ['review', 'verify', 'done'] };
  const GAUGE = [
    ['▱▱▱', { zh: '', en: '' }],
    ['▰▱▱', { zh: ' minimum', en: ' minimum' }],
    ['▰▰▱', { zh: ' medium — 三個檔案，共用清單元件', en: ' medium — 3 files, shared list' }],
  ];
  const STEPS_LEFT = { zh: '3 步', en: '3 steps' };

  // ---- the loop's geometry: five stations clockwise from the top --------
  const RC = { cx: 610, cy: 384, r: 108 };
  const NODES = [
    { th: -90, label: { zh: '命名驗證', en: 'Name the check' }, x: 610, y: 258, anchor: 'middle' },
    { th: -18, label: { zh: '測試先行，看它失敗', en: 'Failing test first' }, x: 728, y: 355, anchor: 'start' },
    { th: 54, label: { zh: '實作一層', en: 'Build one layer' }, x: 688, y: 497, anchor: 'start' },
    { th: 126, label: { zh: '驗證', en: 'Verify' }, x: 532, y: 497, anchor: 'end' },
    { th: 198, label: { zh: '分析乾淨 ✓', en: 'Analysis ✓' }, x: 492, y: 355, anchor: 'end' },
  ];
  const VERIFY_NODE = 3;
  const onRing = th => {
    const a = (th * Math.PI) / 180;
    return { x: RC.cx + RC.r * Math.cos(a), y: RC.cy + RC.r * Math.sin(a) };
  };
  // three steps; the second fails its verification once and goes back to the code
  const KD = [
    ['impl@0.5', -90], ['impl@1.05', -18], ['impl@1.2', -18], ['impl@1.75', 54], ['impl@1.9', 54],
    ['impl@2.45', 126], ['impl@2.6', 126], ['impl@3.15', 198], ['impl@3.55', 198], ['impl@4.1', 270],
    ['impl@4.65', 342], ['impl@4.8', 342], ['impl@5.35', 414], ['impl@5.5', 414], ['@failFrom', 486],
    ['impl@6.9', 486], ['impl@7.5', 414], ['impl@7.7', 414], ['impl@8.25', 486], ['impl@8.4', 486],
    ['impl@8.95', 558], ['impl@9.3', 558], ['impl@9.85', 630],
    ['impl@10.4', 702], ['impl@10.55', 702], ['impl@11.1', 774], ['impl@11.25', 774],
    ['impl@11.8', 846], ['impl@11.95', 846], ['impl@12.5', 918],
  ].map(([r, th]) => [T(r), th]);
  const FAIL = [T('@failFrom'), T('impl@7.6')];
  function thetaAt(t) {
    if (t <= KD[0][0]) return KD[0][1];
    for (let i = 1; i < KD.length; i++) {
      const [tb, b] = KD[i];
      if (t > tb) continue;
      const [ta, a] = KD[i - 1];
      return a + (b - a) * ease(clamp((t - ta) / (tb - ta || 1)));
    }
    return KD[KD.length - 1][1];
  }
  function counterText(t, lang) {
    if (t < T('impl@0.3')) return STEPS_LEFT[lang];
    if (t < T('impl@4.1')) return 'Step 1 / 3';
    if (t < T('impl@9.85')) return 'Step 2 / 3';
    if (t < T('impl@12.6')) return 'Step 3 / 3';
    return '✓ 3 / 3';
  }

  // ---- build the generated layers --------------------------------------
  const rail = $('#rail');
  CHIPS.forEach((c, i) => {
    const wrap = el('g', { 'data-in': `intro@${(0.3 + i * 0.1).toFixed(1)}` }, rail);
    const g = el('g', { 'data-state-of': c.id }, wrap);
    el('rect', { class: 'chip-bg', x: c.x, y: 102, width: c.w, height: 30, rx: 15 }, g);
    el('text', { class: 'chip-t', x: c.x + c.w / 2, y: 117.5, ...langAttrs(c.label) }, g, c.label.zh);
  });

  const ring = $('#ring');
  NODES.forEach(n => {
    const p1 = onRing(n.th + 8), p2 = onRing(n.th + 63);
    el('path', {
      class: 'loop-arc', 'marker-end': 'url(#arA)',
      d: `M${p1.x.toFixed(1)} ${p1.y.toFixed(1)} A${RC.r} ${RC.r} 0 0 1 ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`,
    }, ring);
  });
  const nodeEls = NODES.map(n => {
    const p = onRing(n.th);
    el('text', { class: 'lnode-t', x: n.x, y: n.y, 'text-anchor': n.anchor, ...langAttrs(n.label) }, ring, n.label.zh);
    return el('circle', { class: 'lnode', cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: 10 }, ring);
  });

  const capLayer = $('#captions');
  for (const s of SCENES) {
    const g = el('g', { style: 'opacity:0' }, capLayer);
    el('circle', { class: 'cap-badge', cx: 86, cy: 654, r: 24 }, g);
    el('text', { class: 'cap-num', x: 86, y: 655 }, g, s.badge);
    el('text', { class: 'cap-title', x: 126, y: 641, ...langAttrs(s.title) }, g, s.title.zh);
    s.lines.zh.forEach((zh, i) => {
      el('text', { class: 'cap-line', x: 126, y: 668 + i * 24, ...langAttrs({ zh, en: s.lines.en[i] }) }, g, zh);
    });
    s.capEl = g;
  }

  // ---- render: every frame is a pure function of t ---------------------
  const DIM_FROM = T('intro@2.0');
  const timed = $$('[data-in]').map(e => ({
    e, tin: T(e.dataset.in), tout: e.dataset.out ? T(e.dataset.out) : Infinity,
    rise: e.hasAttribute('data-rise'), drop: e.hasAttribute('data-drop'),
    dim: parseFloat(e.dataset.dim || '0'),
  }));
  const stateEls = $$('[data-state-of]');
  const zoneEls = $$('[data-zone]');
  const gaugeBars = $('#gaugeBars');
  const gaugeRest = $('#gaugeRest');
  const counter = $('#counter');
  const dot = $('#dot');
  const dotCore = dot.querySelector('.dot');
  const sealApprove = $('#sealApprove');
  const SEAL_T = T('@approved');
  const sceneIndex = t => { let i = 0; while (i < SCENES.length - 1 && t >= SCENES[i + 1].start) i++; return i; };
  let lang = pickLang();

  function renderFades(t) {
    for (const x of timed) {
      const a = ramp(t, x.tin, FADE) * (1 - ramp(t, x.tout, FADE));
      const base = x.dim * ramp(t, DIM_FROM, FADE);
      x.e.style.opacity = (base + (1 - base) * a).toFixed(3);
      if (x.rise) x.e.style.transform = `translateY(${((1 - ease(a)) * 10).toFixed(2)}px)`;
      if (x.drop) x.e.style.transform = `translateY(${(-(1 - ease(a)) * 18).toFixed(2)}px)`;
    }
    for (const s of SCENES) {
      const end = s.start + s.dur;
      s.capEl.style.opacity = (ramp(t, s.start, 0.3) * (1 - ramp(t, end - 0.3, 0.3))).toFixed(3);
    }
  }

  function renderStates(t) {
    for (const e of stateEls) {
      const s = S[e.dataset.stateOf];
      const st = t < s.start ? 'todo' : t < s.start + s.dur ? 'active' : 'done';
      if (e.dataset.st !== st) e.dataset.st = st;
    }
    const now = SCENES[sceneIndex(t)].id;
    for (const z of zoneEls) z.classList.toggle('on', ZONES[z.dataset.zone].includes(now));
  }

  function renderGate(t) {
    const [bars, rest] = GAUGE[t < T('size@0.9') ? 0 : t < T('size@1.6') ? 1 : 2];
    gaugeBars.textContent = bars;
    gaugeRest.textContent = rest[lang];
    const a = ramp(t, SEAL_T, 0.3);
    sealApprove.setAttribute('transform', `scale(${(1 + (1 - ease(a)) * 0.9).toFixed(3)})`);
    sealApprove.style.opacity = a.toFixed(3);
  }

  function renderLoop(t) {
    counter.textContent = counterText(t, lang);
    const failing = t >= FAIL[0] && t < FAIL[1];
    const th = thetaAt(t);
    const p = onRing(th);
    dot.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
    const dotOn = ramp(t, T('impl@0.2'), 0.3) * (1 - ramp(t, T('impl@14.3'), 0.4));
    dot.style.opacity = dotOn.toFixed(3);
    dotCore.classList.toggle('bad', failing);
    nodeEls.forEach((n, i) => {
      const d = (((th - NODES[i].th) % 360) + 360) % 360;
      n.classList.toggle('on', dotOn > 0.5 && (d < 6 || d > 354));
      n.classList.toggle('bad', failing && i === VERIFY_NODE);
    });
  }

  function render(t) {
    renderFades(t);
    renderStates(t);
    renderGate(t);
    renderLoop(t);
  }

  // ---- playback, language, and controls ---------------------------------
  const bar = $('#bar'), head = $('#head'), clock = $('#clock'), playBtn = $('#play');
  const fmt = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;

  let t = P.has('t') ? clamp(parseFloat(P.get('t')) || 0, 0, TOTAL - 0.001) : 0;
  let playing = !P.has('t') && !CAPTURE;
  let last = null, dirty = true;

  const segs = SCENES.map(s => {
    const d = document.createElement('div');
    d.className = 'seg';
    d.style.flexGrow = s.dur;
    d.dataset.zh = s.label.zh;
    d.dataset.en = s.label.en;
    d.addEventListener('click', ev => { ev.stopPropagation(); seek(s.start + SEEK_LEAD); });
    bar.insertBefore(d, head);
    return d;
  });

  function postHeight() {
    if (EMBED && window.parent !== window) {
      window.parent.postMessage({ skadiReel: true, height: document.documentElement.scrollHeight }, '*');
    }
  }
  function setLang(next) {
    lang = next;
    document.documentElement.lang = next === 'zh' ? 'zh-Hant' : 'en';
    document.title = DOC_TITLE[next];
    for (const e of $$('[data-en]')) e.textContent = e.dataset[next];
    segs.forEach((d, i) => { d.title = SCENES[i].title[next]; });
    for (const b of $$('.langtoggle button')) b.classList.toggle('active', b.dataset.lang === next);
    dirty = true;
    postHeight();
  }
  function syncUI() {
    head.style.left = `${((t / TOTAL) * 100).toFixed(3)}%`;
    clock.textContent = `${fmt(t)} / ${fmt(TOTAL)}`;
    const i = sceneIndex(t);
    segs.forEach((d, k) => d.classList.toggle('on', k === i));
    playBtn.textContent = PLAY_LABEL[lang][playing ? 0 : 1];
  }
  function seek(x) { t = ((x % TOTAL) + TOTAL) % TOTAL; dirty = true; }
  function step(dir) {
    const i = sceneIndex(t);
    if (dir < 0) seek(t - SCENES[i].start > 1.2 ? SCENES[i].start + SEEK_LEAD : SCENES[(i - 1 + SCENES.length) % SCENES.length].start + SEEK_LEAD);
    else seek(SCENES[(i + 1) % SCENES.length].start + SEEK_LEAD);
  }
  playBtn.addEventListener('click', () => { playing = !playing; dirty = true; });
  $('#prev').addEventListener('click', () => step(-1));
  $('#next').addEventListener('click', () => step(1));
  bar.addEventListener('click', ev => {
    const r = bar.getBoundingClientRect();
    seek(clamp((ev.clientX - r.left) / r.width) * TOTAL);
  });
  for (const b of $$('.langtoggle button')) {
    b.addEventListener('click', () => {
      setLang(b.dataset.lang);
      try { localStorage.setItem(LANG_KEY, b.dataset.lang); } catch (e) { /* storage off: the choice lasts this visit */ }
    });
  }
  document.addEventListener('keydown', ev => {
    if (ev.target.closest && ev.target.closest('button') && ev.key === ' ') return;
    if (ev.key === ' ') { ev.preventDefault(); playing = !playing; dirty = true; }
    else if (ev.key === 'ArrowLeft') step(-1);
    else if (ev.key === 'ArrowRight') step(1);
  });
  addEventListener('load', postHeight);
  addEventListener('resize', postHeight);

  function frame(ts) {
    if (playing && last !== null) {
      t += (ts - last) / 1000;
      if (t >= TOTAL) t -= TOTAL;
      dirty = true;
    }
    last = ts;
    if (dirty) { render(t); syncUI(); dirty = false; }
    requestAnimationFrame(frame);
  }
  // the markup carries the zh text; remember it before the first swap
  for (const e of $$('[data-en]')) if (e.dataset.zh === undefined) e.dataset.zh = e.textContent;
  setLang(lang);
  render(t);
  syncUI();
  dirty = false;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
