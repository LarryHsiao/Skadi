<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="skadi-theme.css" />
    <!-- Favicon: the board's bento in miniature — a green hero tile beside two side tiles. -->
    <link
      rel="icon"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PHJlY3QgeD0nMicgeT0nMicgd2lkdGg9JzI4JyBoZWlnaHQ9JzI4JyByeD0nNScgZmlsbD0nIzFmMjMzMCcvPjxyZWN0IHg9JzUuNScgeT0nNicgd2lkdGg9JzExLjUnIGhlaWdodD0nMjAnIHJ4PScyJyBmaWxsPScjNWFhNDY5Jy8+PHJlY3QgeD0nMTknIHk9JzYnIHdpZHRoPSc3LjUnIGhlaWdodD0nOScgcng9JzEuNScgZmlsbD0nI2NCYWQ1NycvPjxyZWN0IHg9JzE5JyB5PScxNycgd2lkdGg9JzcuNScgaGVpZ2h0PSc5JyByeD0nMS41JyBmaWxsPScjNWI4M2I4Jy8+PC9zdmc+"
    />
    <title>Situation Board</title>
    <style>
      body {
        padding: 1.6rem 2rem;
      }
      .frame {
        border: 2px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 0.7rem;
      }
      .header {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        padding-bottom: 0.6rem;
        margin-bottom: 0.7rem;
      }
      .htop {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.72rem;
        color: var(--accent);
        margin-bottom: 0.55rem;
      }
      .htop .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--green);
      }
      .htop .dot.stale {
        background: var(--red);
      }
      .htop .live {
        margin-left: auto;
      }
      .htop .hlink {
        color: var(--blue);
        border: 1px solid var(--blue);
        border-radius: 4px;
        padding: 0.02rem 0.4rem;
        font-size: 0.66rem;
        text-decoration: none;
      }
      .strip {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0.5rem;
      }
      .tile {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--raise);
        padding: 0.45rem 0.6rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .tile.ghost {
        opacity: 0.55;
      }
      .tile .lbl {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.6rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .kpi {
        font-size: 1.4rem;
        font-weight: 600;
        line-height: 1;
      }
      .kpi small {
        font-size: 0.68rem;
        font-weight: 400;
        color: var(--accent);
      }
      .meter {
        height: 6px;
        border-radius: 4px;
        background: var(--th);
        overflow: hidden;
      }
      .meter.thin {
        height: 4px;
      }
      .meter > i {
        display: block;
        height: 100%;
        background: var(--green);
        transition: width 0.4s ease;
      }
      .meter > i.warn {
        background: var(--red);
      }
      .muted {
        color: var(--accent);
        font-size: 0.72rem;
      }
      .kpi.warn {
        color: var(--red);
      }
      .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.4rem;
      }
      select.app-pick {
        font: inherit;
        font-size: 0.66rem;
        background: var(--panel);
        color: inherit;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.02rem 0.25rem;
        max-width: 100%;
      }
      .spin {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.66rem;
        color: var(--accent);
      }
      .bento {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        gap: 0.6rem;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--raise);
        padding: 0.55rem 0.65rem;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .card.hero {
        grid-row: span 2;
        grid-column: 1;
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--th);
      }
      .ttl {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.66rem;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .ttl .src {
        margin-left: auto;
        opacity: 0.6;
        font-size: 0.6rem;
      }
      .pill {
        display: inline-block;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.58rem;
        padding: 0.08rem 0.42rem;
        border-radius: 10px;
        background: var(--green);
        color: var(--bg);
      }
      .pill.active {
        background: var(--accent);
      }
      .pill.review {
        background: var(--blue);
      }
      .pill.block {
        background: var(--red);
      }
      .pill.quiet {
        background: var(--line);
        color: var(--ink);
      }
      .enter {
        align-self: flex-start;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.58rem;
        color: var(--blue);
        border: 1px solid var(--blue);
        border-radius: 4px;
        padding: 0.06rem 0.4rem;
        text-decoration: none;
      }
      .roster {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        margin-top: 0.2rem;
      }
      .rrow {
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--panel);
        padding: 0.3rem 0.5rem;
        display: grid;
        grid-template-columns: 1.4rem 1fr auto;
        align-items: center;
        gap: 0.45rem;
      }
      .rrow .mark {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.72rem;
      }
      .rrow .mark.done {
        color: var(--green);
      }
      .rrow .mark.todo {
        color: var(--accent);
        opacity: 0.6;
      }
      .rrow .nm {
        font-size: 0.72rem;
      }
      .rrow .st {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.56rem;
        color: var(--accent);
      }
      .empty {
        padding: 2rem;
        text-align: center;
        color: var(--accent);
        font-style: italic;
      }
      @media (max-width: 760px) {
        .strip {
          grid-template-columns: repeat(2, 1fr);
        }
        .bento {
          grid-template-columns: 1fr;
        }
        .card.hero {
          grid-row: auto;
          grid-column: auto;
        }
      }
      /* sweep band — the foot of the board */
      .banddiv {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0.9rem 0 0.6rem;
        color: var(--accent);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.62rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .banddiv::before,
      .banddiv::after {
        content: "";
        height: 1px;
        background: var(--line);
        flex: 1;
      }
      .sweeprows {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .srow {
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--raise);
        padding: 0.32rem 0.55rem;
        display: grid;
        grid-template-columns: 7rem 4.6rem 1fr auto;
        align-items: center;
        gap: 0.5rem;
      }
      .srow .nm {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.64rem;
        color: var(--accent);
      }
      .srow .dt {
        font-size: 0.72rem;
      }
      @media (max-width: 760px) {
        .srow {
          grid-template-columns: 5rem 4rem 1fr auto;
        }
      }
    </style>
  </head>
  <body>
    <h1>The Situation Board</h1>
    <p class="sub">
      Watching <code>~/.skadi/board/</code> — the tiles follow the files.
    </p>

    <div class="frame">
      <div class="header">
        <div class="htop">
          <span class="dot" id="pulse"></span> situation board ·
          <span id="watch">loading…</span>
          <span class="live" id="stamp">—</span>
          <a class="hlink" href="handbook/" target="_blank" rel="noopener"
            >Handbook ↗</a
          >
          <a class="hlink" id="henneth" target="_blank" rel="noopener" hidden
            >Henneth ↗</a
          >
          <a class="hlink" id="galadriel" target="_blank" rel="noopener" hidden
            >Plans ↗</a
          >
          <a class="hlink" id="skills" target="_blank" rel="noopener" hidden
            >Skills ↗</a
          >
        </div>
        <div class="strip" id="strip"></div>
      </div>
      <div class="bento" id="bento">
        <div class="empty">
          No ticket channels yet. Run the writer to raise one.
        </div>
      </div>
      <div class="sweepband" id="sweeps"></div>
    </div>

    <script>
      const POLL_MS = 8000;
      const STABILITY_WARN_BELOW = 98; // crash-free % under this reads as degraded
      let channels = []; // last-known channel payloads
      let lastSig = null; // last rendered signature; null = nothing rendered yet
      // (an empty board signs as "", so the sentinel must not be "").

      // Stability tile state — fetched on demand (app pick), not on the poll
      // loop; a live BigQuery join is not something to fire every 8s.
      let stabilityApps = null; // null = not yet loaded; [] = loaded, none bound
      let stabilitySelected = null;
      let stabilityResult = null;
      let stabilityLoading = false;
      let stabilityError = null;

      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
        );

      async function poll() {
        try {
          const manifest = await (
            await fetch("channels.json?_=" + Date.now())
          ).json();
          const names = manifest.channels || [];
          const loaded = [];
          for (const name of names) {
            loaded.push(await (await fetch(name + "?_=" + Date.now())).json());
          }
          channels = loaded;
          // Re-render only when a channel arrived, left, or changed its stamp.
          const sig = loaded.map((c) => c.id + ":" + c.updated).join("|");
          if (sig !== lastSig) {
            lastSig = sig;
            render();
          }
          mark(true);
        } catch (e) {
          mark(false);
        }
        updateServices();
      }

      // Show a service button only when its json names a URL that a live server
      // answered for — a down service leaves the button hidden rather than
      // offering a link into nothing. Returns the url found, or null.
      async function updateService(id, file) {
        const btn = document.getElementById(id);
        try {
          const h = await (await fetch(file + "?_=" + Date.now())).json();
          if (h && h.url) {
            btn.href = h.url;
            btn.hidden = false;
            return h.url;
          }
        } catch (e) {
          /* not written yet, or unreadable — leave it hidden */
        }
        btn.hidden = true;
        return null;
      }

      // The skills cheatsheet has no channel of its own — it rides Henneth's
      // watched folder, so its liveness is Henneth's liveness.
      function updateSkills(hennethUrl) {
        const btn = document.getElementById("skills");
        if (hennethUrl) {
          btn.href = hennethUrl + "skills-cheatsheet.html";
          btn.hidden = false;
        } else {
          btn.hidden = true;
        }
      }

      async function updateServices() {
        const hennethUrl = await updateService("henneth", "henneth.json");
        await updateService("galadriel", "galadriel.json");
        updateSkills(hennethUrl);
      }

      function mark(ok) {
        document.getElementById("pulse").classList.toggle("stale", !ok);
        // Count tickets alone — growth and sweep channels are not "in progress".
        const n = channels.filter((c) => c.channel === "ticket").length;
        document.getElementById("watch").textContent = n
          ? n + " ticket" + (n > 1 ? "s" : "") + " in progress"
          : "watching…";
        document.getElementById("stamp").textContent =
          (ok ? "◍ live · " : "◍ stale · ") + new Date().toLocaleTimeString();
      }

      function render() {
        const tickets = channels.filter((c) => c.channel === "ticket");
        const growth = channels.find((c) => c.channel === "growth");
        const sweeps = channels.filter((c) => c.channel === "sweep");
        const pulse = channels.find((c) => c.channel === "pulse");
        const stabilityChannels = channels.filter(
          (c) => c.channel === "stability",
        );
        renderStrip(tickets, growth, sweeps, pulse, stabilityChannels);
        renderBody(tickets);
        renderSweeps(sweeps);
      }

      // Sweep verdict → an existing pill class + its label.
      function verdictPill(v) {
        const map = {
          stirred: ["active", "STIRRED"],
          mend: ["block", "MEND"],
          quiet: ["quiet", "QUIET"],
        };
        return map[v] || ["quiet", String(v || "").toUpperCase()];
      }

      // Week-over-week arrow + percent from a current/previous pair.
      function wow(cur, prev) {
        if (prev == null || prev === 0) return "";
        const p = Math.round(((cur - prev) / prev) * 100);
        const arrow = p > 0 ? "▲" : p < 0 ? "▼" : "▪";
        return `${arrow}${Math.abs(p)}% wow`;
      }

      // The Firebase console door for one roster app, or "" when its entry
      // cannot form a link.
      //
      // Guarded rather than trusted: stability-apps.json is hand-maintained and
      // board-stability.py's merge_apps admits any entry bearing a `label`,
      // *replacing* the discovered record — so project, platform or bundle may
      // each be absent. An unguarded read throws, and since this renders inline
      // inside renderStrip's template the throw would blank the whole top strip,
      // not merely this tile.
      //
      // The URL carries no /u/<N> account segment: Google routes to whichever
      // account is signed in and rewrites the path itself, where a hardcoded
      // index would bake one machine's account order into a file that installs
      // to every root. The `:` between platform and bundle stays outside the
      // encoding — Firebase wants it literal, as `ios:com.example.app`.
      function consoleDoor(app) {
        if (!app || !app.project || !app.platform || !app.bundle) return "";
        const appPath = `${encodeURIComponent(app.platform.toLowerCase())}:${encodeURIComponent(app.bundle)}`;
        return `<a class="enter" href="https://console.firebase.google.com/project/${encodeURIComponent(app.project)}/crashlytics/app/${appPath}" target="_blank" rel="noopener" style="font-size:0.7rem">Enter ↵</a>`;
      }

      // The Stability tile's markup for whatever state it's currently in —
      // not yet loaded, no app bound, mid-fetch, errored, or holding a number.
      // `stabilityChannels` is the pulled fallback — stability-<slug>.json
      // channels a model-driven `/board refresh --stability-scrape` wrote,
      // consulted only when the live fetch couldn't produce a number.
      function stabilityTileHtml(stabilityChannels) {
        if (stabilityApps === null) {
          return `<div class="tile ghost"><div class="lbl">Stability</div>
      <div class="kpi">—</div><div class="muted">loading…</div></div>`;
        }
        if (!stabilityApps.length) {
          return `<div class="tile ghost"><div class="lbl">Stability</div>
      <div class="kpi">—</div>
      <div class="muted">no app bound · run /beleg once to bind one</div></div>`;
        }
        const options = stabilityApps
          .map(
            (a) =>
              `<option value="${esc(a.label)}"${a.label === stabilitySelected ? " selected" : ""}>${esc(a.label)}</option>`,
          )
          .join("");
        let body;
        // The pulled reading for this app, if one was ever written. Looked up
        // before the branch because both ways the live fetch can fail to produce
        // a number need it: a fetch that returns null, and one that errors
        // outright. The errored case is the commoner — a project with no
        // Crashlytics BigQuery export makes board-server.py answer 400 — and it
        // once returned here without ever looking, leaving a scraped number on
        // disk, correct and invisible.
        const pulled = stabilityChannels.find(
          (c) => c.label === stabilitySelected && c.crash_free_pct != null,
        );
        const app = stabilityApps.find((a) => a.label === stabilitySelected);
        // The door hangs off which app is picked, never off whether a number
        // came back — it is most wanted when the number didn't.
        const door = consoleDoor(app);
        if (stabilityLoading) {
          body = `<div class="row"><div class="kpi">—</div>${door}</div>
      <div class="meter"><i style="width:0%"></i></div>
      <div class="spin">querying BigQuery…</div>`;
        } else if (stabilityError && !pulled) {
          body = `<div class="row"><div class="kpi">—</div>${door}</div>
      <div class="meter"><i style="width:0%"></i></div>
      <div class="muted">fetch failed: ${esc(stabilityError)}</div>`;
        } else if (stabilityResult || stabilityError) {
          const live = stabilityResult ? stabilityResult.crash_free_pct : null;
          // No source/age label by design — the tile shows whichever number
          // it has, live BigQuery or a last-scraped console reading alike.
          const fallback = live == null ? pulled : null;
          const pct =
            live != null ? live : fallback ? fallback.crash_free_pct : null;
          const warn = pct != null && pct < STABILITY_WARN_BELOW;
          const platform = app && app.platform ? esc(app.platform) : "";
          let detail;
          if (pct == null) {
            detail = esc(stabilityResult.note);
          } else if (fallback) {
            detail = platform || "—";
          } else {
            detail = `${stabilityResult.window_days}d window${platform ? " · " + platform : ""}`;
          }
          body = `<div class="row"><div class="kpi${warn ? " warn" : ""}">${pct == null ? "—" : pct + "%"}<small> crash-free users</small></div>${door}</div>
      <div class="meter"><i${warn ? ' class="warn"' : ""} style="width:${pct || 0}%"></i></div>
      <div class="muted">${detail}</div>`;
        } else {
          body = `<div class="row"><div class="kpi">—</div>${door}</div>
      <div class="meter"><i style="width:0%"></i></div>
      <div class="muted">pick an app</div>`;
        }
        return `<div class="tile">
      <div class="row"><div class="lbl">Stability</div>
        <select class="app-pick" id="stabilityPick">${options}</select></div>
      ${body}</div>`;
      }

      // Roster once on load — a new binding (running /beleg in some other
      // repo) needs a page refresh to show up, not a poll; the roster comes
      // from a filesystem glob, not the channel manifest.
      async function loadStabilityApps() {
        try {
          stabilityApps = await (
            await fetch("/stability/apps?_=" + Date.now())
          ).json();
        } catch (e) {
          stabilityApps = [];
        }
        if (stabilityApps.length && !stabilitySelected) {
          fetchStability(stabilityApps[0].label);
        } else {
          render();
        }
      }

      async function fetchStability(label) {
        stabilitySelected = label;
        stabilityLoading = true;
        stabilityError = null;
        stabilityResult = null;
        render();
        let result = null;
        let error = null;
        try {
          const res = await fetch(
            "/stability/fetch?label=" +
              encodeURIComponent(label) +
              "&_=" +
              Date.now(),
          );
          const body = await res.json();
          if (!res.ok) throw new Error(body.error || "fetch failed");
          result = body;
        } catch (e) {
          error = String((e && e.message) || e);
        }
        // The user may have switched apps while this request was in flight —
        // a slower A must not overwrite a faster B's already-rendered result.
        if (stabilitySelected !== label) return;
        stabilityResult = result;
        stabilityError = error;
        stabilityLoading = false;
        render();
      }

      function renderStrip(tickets, growth, sweeps, pulse, stabilityChannels) {
        const blocked = tickets.filter((t) => t.blocked);
        const stir = sweeps.filter((s) => s.verdict === "stirred").length;
        const mend = sweeps.filter((s) => s.verdict === "mend").length;
        const quiet = sweeps.filter((s) => s.verdict === "quiet").length;

        const strip = document.getElementById("strip");
        strip.innerHTML = `
    <div class="tile"><div class="lbl">Working set</div>
      <div class="kpi">${tickets.length}<small> in progress</small></div>
      <div class="muted"${blocked.length ? ' style="color:var(--red)"' : ""}>${blocked.length} blocked${blocked.length ? " · " + esc(blocked[0].id) : ""}</div></div>
    ${
      growth
        ? `<div class="tile"><div class="lbl">Metis growth</div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:.4rem">
        <div class="kpi">${esc(growth.wau)}<small> WAU</small></div>
        ${growth.url ? `<a class="enter" href="${esc(growth.url)}" target="_blank" rel="noopener" style="font-size:0.7rem">Enter ↵</a>` : ""}
      </div>
      <div class="muted">MAU ${esc(growth.mau)} · ${wow(growth.wau, growth.wau_prev)}</div></div>`
        : `<div class="tile ghost"><div class="lbl">Metis growth</div><div class="kpi">—</div>
      <div class="muted">channel not wired</div></div>`
    }
    ${stabilityTileHtml(stabilityChannels)}
    ${
      sweeps.length
        ? `<div class="tile"><div class="lbl">Sweeps</div>
      <div class="kpi"${stir ? ' style="color:var(--accent)"' : ""}>${stir}<small> stirred</small></div>
      <div class="muted">${mend} mend · ${quiet} quiet</div></div>`
        : `<div class="tile ghost"><div class="lbl">Sweeps</div><div class="kpi">—</div>
      <div class="muted">channel not wired</div></div>`
    }
    ${
      pulse && pulse.headline
        ? `<div class="tile"><div class="lbl">Adherence</div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:.4rem">
        <div class="kpi">${pulse.headline.overall == null ? "—" : esc(pulse.headline.overall) + "%"}<small> avg</small></div>
        ${pulse.url ? `<a class="enter" href="${esc(pulse.url)}" target="_blank" rel="noopener" style="font-size:0.7rem">Enter ↵</a>` : ""}
      </div>
      <div class="muted" style="font-size:0.6rem">${
        Object.entries(pulse.headline.byTier || {})
          .map(([t, v]) => esc(t.slice(0, 6)) + " " + esc(v) + "%")
          .join(" · ") || "—"
      }</div></div>`
        : ""
    }`;
      }

      function renderSweeps(sweeps) {
        const el = document.getElementById("sweeps");
        if (!sweeps.length) {
          el.innerHTML = "";
          return;
        }
        const rows = sweeps
          .map((s) => {
            const [cls, label] = verdictPill(s.verdict);
            const door = s.url
              ? `<a class="enter" href="${esc(s.url)}" target="_blank" rel="noopener">Enter ↵</a>`
              : "";
            const nm = s.scope
              ? `${esc(s.name)} · ${esc(s.scope)}`
              : esc(s.name);
            return `<div class="srow">
      <span class="nm">${nm}</span>
      <span><span class="pill ${cls}">${esc(label)}</span></span>
      <span class="dt">${esc(s.detail) || "—"}</span>
      ${door}</div>`;
          })
          .join("");
        el.innerHTML = `<div class="banddiv">amon-sul · sweeps</div><div class="sweeprows">${rows}</div>`;
      }

      function renderBody(tickets) {
        const bento = document.getElementById("bento");
        if (!tickets.length) {
          bento.innerHTML = `<div class="empty">No ticket channels yet. Run the writer to raise one.</div>`;
          return;
        }
        const active = tickets.find((t) => t.active) || tickets[0];
        const others = tickets.filter((t) => t !== active);
        bento.innerHTML = heroCard(active) + others.map(otherCard).join("");
      }

      function heroCard(t) {
        const ac = t.ac || {};
        const roster = (t.subtasks || [])
          .map(
            (s) => `
    <div class="rrow">
      <span class="mark ${s.done ? "done" : "todo"}">${s.done ? "✓" : "○"}</span>
      <span class="nm">${esc(s.title) || esc(s.id)}</span>
      <span class="st">${esc(s.status)}</span>
    </div>`,
          )
          .join("");
        const statusPill = t.blocked
          ? "block"
          : t.statusCategory === "done"
            ? ""
            : "review";
        // Name the AC's true source — a bar drawn from the description must not
        // read "subtasks", and the empty roster says where the count came from.
        const fromDesc = ac.source === "description";
        const acNoun = fromDesc ? "checklist" : "subtasks";
        const rosterEmpty = fromDesc
          ? "acceptance drawn from the description checklist"
          : "no subtasks on this ticket";
        return `
    <div class="card hero">
      <div class="ttl"><span class="pill active">ACTIVE</span> ${esc(t.id)}
        <span class="src">${esc(t.source)} · ${esc(t.status)}</span></div>
      <div style="font-size:0.85rem;font-weight:600">${esc(t.title)}</div>
      <div><span class="pill ${statusPill}">${esc(t.status)}</span>
        ${t.priority ? `<span class="muted"> · ${esc(t.priority)}</span>` : ""}</div>
      <div class="ttl" style="margin-top:0.3rem">Acceptance
        <span class="src">${ac.total ? ac.met + " / " + ac.total + " " + acNoun : "no subtasks"}</span></div>
      <div class="kpi">${ac.pct == null ? "—" : ac.pct + "%"}<small> AC</small></div>
      <div class="meter"><i style="width:${ac.pct || 0}%"></i></div>
      <div class="roster">${roster || `<div class="muted">${rosterEmpty}</div>`}</div>
      <a class="enter" href="${esc(t.url)}" target="_blank" rel="noopener">Enter ↵</a>
    </div>`;
      }

      function otherCard(t) {
        const ac = t.ac || {};
        return `
    <div class="card" data-key="${esc(t.id)}" title="Click to make active" style="cursor:pointer">
      <div class="ttl">${esc(t.id)} <span class="src">${esc(t.status)}</span></div>
      <div class="nm" style="font-size:0.74rem">${esc(t.title)}</div>
      <div class="kpi" style="font-size:1.1rem">${ac.pct == null ? "—" : ac.pct + "%"}<small> AC</small></div>
      <div class="meter thin"><i style="width:${ac.pct || 0}%${t.blocked ? ";background:var(--red)" : ""}"></i></div>
      <a class="enter" href="${esc(t.url)}" target="_blank" rel="noopener">Enter ↵</a>
    </div>`;
      }

      // Click a non-hero card to promote it — the board's one write. The Enter
      // link keeps its own job (opening the ticket), so a click on it is let by.
      document.getElementById("bento").addEventListener("click", (e) => {
        if (e.target.closest("a.enter")) return;
        const card = e.target.closest(".card[data-key]");
        if (card) promote(card.getAttribute("data-key"));
      });

      // The strip is rebuilt wholesale each render, so the dropdown's own
      // listener would be lost each time — delegate on the strip instead.
      document.getElementById("strip").addEventListener("change", (e) => {
        if (e.target.id === "stabilityPick") fetchStability(e.target.value);
      });

      // Paint the new hero at once, then persist it. The next poll reconciles
      // from disk — so a failed POST simply reverts within a poll, no rollback.
      async function promote(key) {
        for (const c of channels) {
          if (c.channel === "ticket") c.active = c.id === key;
        }
        lastSig = null; // let the next poll re-render even if stamps are unchanged
        render();
        try {
          await fetch("active/" + encodeURIComponent(key), { method: "POST" });
        } catch (e) {
          mark(false);
        }
      }

      poll();
      setInterval(poll, POLL_MS);
      loadStabilityApps();
    </script>
  </body>
</html>
